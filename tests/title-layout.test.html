<!doctype html>
<meta charset="utf-8">
<title>Card title layout tests</title>
<pre id="result">Running…</pre>
<script type="module">
  import { subtitleLayout, titleLayout } from "../js/svg-engine.js?v=phase9d";
  import { TF } from "../js/themes.js?v=phase9d";

  const sampleTitle = "THREE DAYS GRACE";
  const shortSub = subtitleLayout("Alt-Rock // Canada", 5.8, 96);
  const longSub = subtitleLayout("Alternative Rock // Abingdon-on-Thames", 5.8, 96);
  const extraLongSub = subtitleLayout("Progressive Psychedelic Experiment // Kingston upon Thames", 5.8, 96);
  const checks = [
    ["100% keeps the existing two-line layout", titleLayout(sampleTitle, TF.pirata, 136, 1).wrapped],
    ["85% fits the sample title on one line", titleLayout(sampleTitle, TF.pirata, 136, 0.85).lines.join(" ") === sampleTitle],
    ["long titles still wrap", titleLayout("A TITLE THAT IS MUCH TOO LONG TO FIT", TF.pirata, 136, 0.85).wrapped],
    ["out-of-range values are clamped", titleLayout(sampleTitle, TF.pirata, 136, 2).size === TF.pirata.s],
    ["short genre // place stays single line at full size", !shortSub.wrapped && shortSub.size === 5.8],
    ["long genre // place wraps to 2 readable lines", longSub.wrapped && longSub.lines.length === 2 && longSub.size >= 4.8],
    ["very long genre // place wraps cleanly without truncating away", extraLongSub.wrapped && extraLongSub.lines.length === 2 && extraLongSub.size >= 4.0]
  ];

  const failed = checks.filter(([, passed]) => !passed);
  document.querySelector("#result").textContent = failed.length
    ? `Failed: ${failed.map(([name]) => name).join(", ")}`
    : `Passed ${checks.length} card title layout checks.`;
  if (failed.length) throw new Error(document.querySelector("#result").textContent);
</script>
